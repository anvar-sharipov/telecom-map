  postgres:
    image: postgis/postgis:16-3.4
    container_name: telecom_map_postgres
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5433:5432'
    volumes:
      - telecom_map_data:/var/lib/postgresql/data
    networks:
      - telecom_map_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    # image: migrate/migrate:latest
    image: migrate/migrate:v4.17.1
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    networks:
      - telecom_map_network
    entrypoint: ['migrate']

