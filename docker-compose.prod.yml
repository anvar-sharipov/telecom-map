services:
  postgres:
    image: postgres:16
    container_name: telecom_map_postgres_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - telecom_map_data_prod:/var/lib/postgresql/data
      - ./backend/migrations:/migrations
    networks:
      - telecom_map_network_prod
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:latest
    container_name: telecom_map_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
    entrypoint: ['/wait-for-postgres.sh', 'postgres'] # ✅ ждём Postgres
    command:
      [
        '-path=/migrations',
        '-database=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable',
        'up',
      ]
    volumes:
      - ./backend/migrations:/migrations # SQL миграции
      - ./backend/.entrypoints:/wait-for-postgres.sh # скрипт wait-for-postgres.sh
    networks:
      - telecom_map_network_prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: telecom_map_backend_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - telecom_map_network_prod
    expose:
      - '8000'

  nginx:
    image: nginx:alpine
    container_name: telecom_map_nginx_prod
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - telecom_map_network_prod

volumes:
  telecom_map_data_prod:

networks:
  telecom_map_network_prod:
    driver: bridge
